<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
	<policy user="root">
		<allow own="org.zerotier.nm.Status"/>
	</policy>
	<policy context="default">
		<allow send_destination="org.zerotier.nm.Status"
		       send_interface="org.zerotier.nm.Status1"
		       send_member="GetNetworkStatus"/>
		<allow receive_sender="org.zerotier.nm.Status"/>
	</policy>
</busconfig>
