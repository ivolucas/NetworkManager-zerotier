name: build

on:
  push:
  pull_request:

jobs:
  meson-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            systemd_dev_pkg: systemd-dev
          - os: ubuntu-22.04
            systemd_dev_pkg: "" # systemd.pc ships in the base `systemd` package on 22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libnm-dev libgtk-4-dev \
            libjson-glib-dev network-manager-dev pkg-config ${{ matrix.systemd_dev_pkg }}
      - name: Configure
        run: meson setup build --prefix=/usr
      - name: Build
        run: ninja -C build
      - name: Test
        run: meson test -C build

  deb-build:
    needs: meson-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            systemd_dev_pkg: systemd-dev
          - os: ubuntu-22.04
            systemd_dev_pkg: "" # systemd.pc ships in the base `systemd` package on 22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper lintian meson ninja-build \
            pkg-config libnm-dev libgtk-4-dev libjson-glib-dev network-manager-dev \
            ${{ matrix.systemd_dev_pkg }}
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Lint .deb
        run: lintian ../*.deb || true
      - name: Stage .deb into the workspace
        # dpkg-buildpackage places its output one directory above the
        # checkout, which actions/upload-artifact@v4 refuses to reference
        # directly (no `..` in path patterns). Renaming also disambiguates
        # the two matrix builds, which otherwise produce identically-named
        # files (same Debian version) that would collide when merged
        # together for the release job.
        run: |
          mkdir -p dist
          for f in ../*.deb; do
            mv "$f" "dist/$(basename "${f%.deb}")-${{ matrix.os }}.deb"
          done
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-manager-zerotier-deb-${{ matrix.os }}
          path: dist/*.deb

  release:
    needs: deb-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download .deb artifacts (both Ubuntu releases)
        uses: actions/download-artifact@v4
        with:
          pattern: network-manager-zerotier-deb-*
          path: dist
          merge-multiple: true
      - name: Attach .debs to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.deb --repo "$repo" --title "$tag" --generate-notes
          fi
